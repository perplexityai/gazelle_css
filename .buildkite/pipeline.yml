---
agents:
  queue: oss
steps:
- label: bazel 9.0.0 test
  key: test-oss-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh test
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 9.0.0
- label: example / bazel 9.0.0
  key: example-oss-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh example
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 9.0.0
- label: gazelle_ts integration / bazel 9.0.0
  key: integration-oss-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh integration
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 9.0.0
- label: bazel 8.6.0 test
  key: test-oss-8-6-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh test
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.6.0
- label: example / bazel 8.6.0
  key: example-oss-8-6-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh example
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.6.0
- label: gazelle_ts integration / bazel 8.6.0
  key: integration-oss-8-6-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/run.sh integration
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  timeout_in_minutes: 60
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 8.6.0
- label: Verify hooks
  key: verify-hooks
  command: bash .buildkite/verify-hooks.sh
  agents:
    queue: oss
  timeout_in_minutes: 15
- label: Cross-build smoke binaries / Bazel 9.0.0
  key: smoke-build-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/build-smoke.sh
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  env:
    USE_BAZEL_VERSION: 9.0.0
  timeout_in_minutes: 60
- label: Artifact smoke / oss / Bazel 9.0.0
  key: artifact-smoke-oss-9-0-0
  depends_on: smoke-build-9-0-0
  agents:
    queue: oss
  command: bash .buildkite/smoke.sh
  env:
    USE_BAZEL_VERSION: 9.0.0
    SMOKE_PRODUCER_STEP: smoke-build-9-0-0
  timeout_in_minutes: 15
- label: Artifact smoke / oss_darwin_arm64 / Bazel 9.0.0
  key: artifact-smoke-oss_darwin_arm64-9-0-0
  depends_on: smoke-build-9-0-0
  agents:
    queue: oss_darwin_arm64
  command: bash .buildkite/smoke.sh
  env:
    USE_BAZEL_VERSION: 9.0.0
    SMOKE_PRODUCER_STEP: smoke-build-9-0-0
  timeout_in_minutes: 15
- label: Cross-build smoke binaries / Bazel 8.6.0
  key: smoke-build-8-6-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --registry oss-ci-v2 --name bazel
  - bash .buildkite/build-smoke.sh
  - buildkite-agent cache save --registry oss-ci-v2 --name bazel
  env:
    USE_BAZEL_VERSION: 8.6.0
  timeout_in_minutes: 60
- label: Artifact smoke / oss / Bazel 8.6.0
  key: artifact-smoke-oss-8-6-0
  depends_on: smoke-build-8-6-0
  agents:
    queue: oss
  command: bash .buildkite/smoke.sh
  env:
    USE_BAZEL_VERSION: 8.6.0
    SMOKE_PRODUCER_STEP: smoke-build-8-6-0
  timeout_in_minutes: 15
- label: Artifact smoke / oss_darwin_arm64 / Bazel 8.6.0
  key: artifact-smoke-oss_darwin_arm64-8-6-0
  depends_on: smoke-build-8-6-0
  agents:
    queue: oss_darwin_arm64
  command: bash .buildkite/smoke.sh
  env:
    USE_BAZEL_VERSION: 8.6.0
    SMOKE_PRODUCER_STEP: smoke-build-8-6-0
  timeout_in_minutes: 15
- label: Artifact smoke / Windows AMD64 / Bazel 9.0.0
  key: artifact-smoke-windows-amd64-9-0-0
  depends_on: smoke-build-9-0-0
  agents:
    queue: oss_win_amd64
  command: powershell -NoProfile -ExecutionPolicy Bypass -File .buildkite/smoke-windows.ps1
  timeout_in_minutes: 15
  env:
    USE_BAZEL_VERSION: 9.0.0
    SMOKE_PRODUCER_STEP: smoke-build-9-0-0
- label: Artifact smoke / Windows AMD64 / Bazel 8.6.0
  key: artifact-smoke-windows-amd64-8-6-0
  depends_on: smoke-build-8-6-0
  agents:
    queue: oss_win_amd64
  command: powershell -NoProfile -ExecutionPolicy Bypass -File .buildkite/smoke-windows.ps1
  timeout_in_minutes: 15
  env:
    USE_BAZEL_VERSION: 8.6.0
    SMOKE_PRODUCER_STEP: smoke-build-8-6-0
notify:
- github_commit_status:
    context: release-ready/gazelle-css
    blocked_builds_as_pending: true
  if: build.branch == "main" && build.pull_request.id == null && build.tag == null
