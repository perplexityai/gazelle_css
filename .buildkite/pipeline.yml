---
agents:
  queue: oss
steps:
- label: bazel 9.0.0 test
  key: test-oss-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --name bazel
  - bash .buildkite/run.sh test
  - buildkite-agent cache save --name bazel
  timeout_in_minutes: 60
  cache:
    name: gazelle-css-test-oss-9-0-0
    size: 40g
    paths:
    - "/tmp/gazelle-css-ci"
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 9.0.0
- label: example / bazel 9.0.0
  key: example-oss-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --name bazel
  - bash .buildkite/run.sh example
  - buildkite-agent cache save --name bazel
  timeout_in_minutes: 60
  cache:
    name: gazelle-css-example-oss-9-0-0
    size: 40g
    paths:
    - "/tmp/gazelle-css-ci"
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 9.0.0
- label: gazelle_ts integration / bazel 9.0.0
  key: integration-oss-9-0-0
  agents:
    queue: oss
  command:
  - buildkite-agent cache restore --name bazel
  - bash .buildkite/run.sh integration
  - buildkite-agent cache save --name bazel
  timeout_in_minutes: 60
  cache:
    name: gazelle-css-integration-oss-9-0-0
    size: 40g
    paths:
    - "/tmp/gazelle-css-ci"
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
  env:
    USE_BAZEL_VERSION: 9.0.0
