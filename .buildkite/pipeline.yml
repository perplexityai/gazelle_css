    queue: oss
  command:
  - buildkite-agent cache restore --name bazel
  - bash .buildkite/run.sh example
  - buildkite-agent cache save --name bazel
  timeout_in_minutes: 60
  cache:
    name: gazelle-css-example-oss-8-6-0
    size: 40g
    paths:
    - "/tmp/gazelle-css-ci"
  artifact_paths: ".buildkite-artifacts/**/*;bazel-testlogs/**/test.log;bazel-testlogs/**/test.xml;examples/*/bazel-testlogs/**/test.log;examples/*/bazel-testlogs/**/test.xml;bcr_test/bazel-testlogs/**/test.log"
