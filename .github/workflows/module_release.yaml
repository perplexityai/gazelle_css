name: module-release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.1.0)'
        type: string
        required: true

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

jobs:
  buildkite:
    name: Verify release commit on Buildkite
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      statuses: read
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Wait for exact main Buildkite build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 .github/scripts/buildkite-release-gate.py

  release:
    needs: buildkite
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.4.0
    with:
      # Recheck the checkout SHA; the reusable workflow appends cache flags.
      bazel_test_command: python3 .github/scripts/buildkite-release-gate.py --expected-commit ${{ needs.buildkite.outputs.commit }}
      mount_bazel_caches: false
      release_files: gazelle_css-*.tar.gz
      prerelease: false
      tag_name: ${{ inputs.tag || github.ref_name }}

  publish-to-bcr:
    needs: release
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.4.2
    with:
      tag_name: ${{ inputs.tag || github.ref_name }}
      registry_fork: perplexityai/bazel-central-registry
      draft: false
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
